{% extends "base.html" %}
{% block title %}Message sent · {{ site_name }}{% endblock %}

{% block content %}
<section class="center-page">
    <div class="glass-card success-card">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12.5 4.2 4.2L19 7"/>
            </svg>
        </div>
        <div class="eyebrow">Delivered</div>
        <h1>Your message was sent.</h1>
        <p>
            Thank you. The administrator can now view it from the private dashboard.
        </p>
        <a class="primary-button link-button" href="{{ url_for('home') }}">
            Send another message
        </a>
    </div>
</section>
{% endblock %}
